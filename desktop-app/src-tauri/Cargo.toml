[package]
name = "crm360"
version = "0.1.0"
description = "360annonces CRM desktop client"
edition = "2021"
rust-version = "1.77"

[lib]
name = "crm360_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Size/RAM profile: native WebView (WebView2 / WKWebView / WebKitGTK), no bundled Chromium, no Node runtime.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
